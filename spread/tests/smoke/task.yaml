summary: MySQL rock smoke tests

execute: |
  echo "Running smoke test..."

  echo "Connecting DB..."
  mysql -h 127.0.0.1 --password=myS3cr3tp@ss -P 3432 -u root -e "select now();"

  echo "Connection DB with wrong credentials..."
  mysql -h 127.0.0.1 --password=wrongpass -P 3432 -u root -e "select now();" && exit 1 || true # failure expected

  echo "Checking Pebble UI..."
  docker exec -t "${SPREAD_TASK//\//_}" pebble stop mysql
  mysql -h 127.0.0.1 --password=myS3cr3tp@ss -P 3432 -u root -e "select now();" && exit 1 || true # failure expected

  docker exec -t "${SPREAD_TASK//\//_}" pebble start mysql
  mysql -h 127.0.0.1 --password=myS3cr3tp@ss -P 3432 -u root -e "select now();"

  docker exec -t "${SPREAD_TASK//\//_}" pebble restart mysql
  mysql -h 127.0.0.1 --password=myS3cr3tp@ss -P 3432 -u root -e "select now();"

  docker exec -t "${SPREAD_TASK//\//_}" pebble logs
  docker exec -t "${SPREAD_TASK//\//_}" pebble services

