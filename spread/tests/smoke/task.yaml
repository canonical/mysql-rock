summary: MySQL rock smoke tests

execute: |
  echo "Running smoke test..."

  echo "Connecting DB..."
  docker exec "${SPREAD_TASK//\//_}" mysql -u root --password=myS3cr3tp@ss --host=127.0.0.1 --protocol=TCP --execute="select now();"

  echo "Connection DB with wrong credentials..."
  docker exec "${SPREAD_TASK//\//_}" mysql -u root --password=wrongpass --host=127.0.0.1 --protocol=TCP --execute="select now();" && exit 1 || true

  echo "Checking Pebble UI..."
  docker exec -t "${SPREAD_TASK//\//_}" pebble stop mysql
  docker exec "${SPREAD_TASK//\//_}" mysql -u root --password=myS3cr3tp@ss --host=127.0.0.1 --protocol=TCP --execute="select now();" && exit 1 || true

  docker exec -t "${SPREAD_TASK//\//_}" pebble start mysql
  retry --times=10 --delay=2 -- docker exec "${SPREAD_TASK//\//_}" mysql -u root --password=myS3cr3tp@ss --host=127.0.0.1 --protocol=TCP --execute="select now();"

  docker exec -t "${SPREAD_TASK//\//_}" pebble restart mysql
  retry --times=10 --delay=2 -- docker exec "${SPREAD_TASK//\//_}" mysql -u root --password=myS3cr3tp@ss --host=127.0.0.1 --protocol=TCP --execute="select now();"

  docker exec -t "${SPREAD_TASK//\//_}" pebble logs
  docker exec -t "${SPREAD_TASK//\//_}" pebble services
