summary: MySQL rock smoke tests

prepare: |
  docker run -d -e MYSQL_ROOT_PASSWORD=myS3cr3tp@ss -p 3432:3306 --name "${SPREAD_TASK//\//_}" mysql:spreadtest

  retry --times=30 --delay=2 -- \
    docker exec "${SPREAD_TASK//\//_}" mysql --host 127.0.0.1 --password=myS3cr3tp@ss --user=root --execute="select now();"

execute: |
  echo "Running smoke test..."

  echo "Connecting DB..."
  mysql --host 127.0.0.1 --password=myS3cr3tp@ss --port=3432 --user=root --execute="select now();"

  echo "Connection DB with wrong credentials..."
  mysql --host 127.0.0.1 --password=wrongpass --port=3432 --user=root --execute="select now();" && exit 1 || true # failure expected

  echo "Checking Pebble UI..."
  docker exec -t "${SPREAD_TASK//\//_}" pebble stop mysql
  mysql --host 127.0.0.1 --password=myS3cr3tp@ss --port=3432 --user=root --execute="select now();" && exit 1 || true # failure expected

  docker exec -t "${SPREAD_TASK//\//_}" pebble start mysql
  sleep 1
  mysql --host 127.0.0.1 --password=myS3cr3tp@ss --port=3432 --user=root --execute="select now();"

  docker exec -t "${SPREAD_TASK//\//_}" pebble restart mysql
  sleep 1
  mysql --host 127.0.0.1 --password=myS3cr3tp@ss --port=3432 --user=root --execute="select now();"

  docker exec -t "${SPREAD_TASK//\//_}" pebble logs
  docker exec -t "${SPREAD_TASK//\//_}" pebble services

restore: |
  docker rm --force "${SPREAD_TASK//\//_}" || true    
