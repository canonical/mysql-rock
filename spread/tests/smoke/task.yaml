summary: MySQL rock smoke tests

execute: |
  echo "Running smoke test..."
  CONTAINER_IP=$(podman inspect "${SPREAD_TASK//\//_}" --format "{{.NetworkSettings.IPAddress}}")

  echo "Connecting DB..."
  mysql --host "${CONTAINER_IP}" --password=myS3cr3tp@ss --port=3306 --user=root --execute="select now();"

  echo "Connection DB with wrong credentials..."
  mysql --host "${CONTAINER_IP}" --password=wrongpass --port=3306 --user=root --execute="select now();" && exit 1 || true

  echo "Checking Pebble UI..."
  docker exec -t "${SPREAD_TASK//\//_}" pebble stop mysql
  mysql --host "${CONTAINER_IP}" --password=myS3cr3tp@ss --port=3306 --user=root --execute="select now();" && exit 1 || true

  docker exec -t "${SPREAD_TASK//\//_}" pebble start mysql
  retry --times=10 --delay=2 -- mysql --host "${CONTAINER_IP}" --password=myS3cr3tp@ss --port=3306 --user=root --execute="select now();"

  docker exec -t "${SPREAD_TASK//\//_}" pebble restart mysql
  retry --times=10 --delay=2 -- mysql --host "${CONTAINER_IP}" --password=myS3cr3tp@ss --port=3306 --user=root --execute="select now();"

  docker exec -t "${SPREAD_TASK//\//_}" pebble logs
  docker exec -t "${SPREAD_TASK//\//_}" pebble services
