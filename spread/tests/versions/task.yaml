summary: MySQL versions test

execute: |
  echo "Running versions test..."

  ROCK_VERSION="$(awk '/^version: /{gsub(/'"'"'/, "", $2); print $2;exit}' "${SPREAD_PATH}"/rockcraft.yaml)"
  docker exec "${SPREAD_TASK//\//_}" mysql -u root --password=myS3cr3tp@ss --host=127.0.0.1 --protocol=TCP --execute="select @@version;" | grep -q -e "^${ROCK_VERSION}"
