project: mysql-rock

path: /home/ubuntu/mysql-rock

environment:
  CRAFT_ARTIFACT: $(HOST:printenv CRAFT_ARTIFACT)

backends:
  lxd:
    type: lxd
    systems:
      - ubuntu-24.04

suites:
  spread/tests/:
    summary: General integration tests

    prepare: |
      apt update
      apt install -y podman skopeo podman-docker retry


      skopeo copy "oci-archive:${SPREAD_PATH}/$(basename "${CRAFT_ARTIFACT}")" "docker-archive:/tmp/rock-image.tar:mysql:spreadtest"
      podman load -i /tmp/rock-image.tar
      podman tag localhost/mysql:spreadtest mysql:spreadtest || true

      apt install -y mysql-client
    prepare-each: |
      docker run -d --rm -e MYSQL_ROOT_PASSWORD=myS3cr3tp@ss --name "${SPREAD_TASK//\//_}" mysql:spreadtest
      CONTAINER_IP=$(podman inspect "${SPREAD_TASK//\//_}" --format "{{.NetworkSettings.IPAddress}}")
      retry --times=30 --delay=2 -- mysql -u root --password=myS3cr3tp@ss --host="$CONTAINER_IP" --port=3306 --execute="select now();"
    restore-each: |
      docker kill "${SPREAD_TASK//\//_}" || true
    restore: |
      podman rmi --force mysql:spreadtest || true

exclude:
  - .git

kill-timeout: 1h
