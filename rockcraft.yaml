name: mysql
base: ubuntu@26.04
version: '9.7.2'
summary: MySQL rock OCI
description: |
    MySQL built from the official MySQL package from the MySQL repository.
    For more information on rocks, visit https://github.com/canonical/rockcraft.
license: Apache-2.0
platforms:
    amd64:
    arm64:
    #s390x:  # No s390x snap available yet, restore when it's available

environment:
    TZ: UTC

services:
    mysql:
        override: replace
        command: /usr/local/bin/entrypoint.sh mysqld
        startup: enabled
        user: mysql
        group: mysql

parts:
    mysql:
        plugin: nil
        stage-snaps:
            - mysql/9.7/edge
        overlay-packages:
            - tzdata
            - openssl
        overlay-script: |
            craftctl default
            mkdir -p $CRAFT_OVERLAY/licenses
            mv $CRAFT_OVERLAY/usr/share/doc/openssl/copyright $CRAFT_OVERLAY/licenses/COPYRIGHT-openssl
        override-prime: |
            craftctl default
            # Remove stale snap config files (they reference /var/snap paths)
            rm -f $CRAFT_PRIME/etc/my.cnf
            rm -f $CRAFT_PRIME/etc/mysqld.cnf
            # Remove snap metadata
            rm -rf $CRAFT_PRIME/meta.mysql
            # Move MySQL Router LICENSE alongside other MySQL licenses
            mv $CRAFT_PRIME/usr/LICENSE.router $CRAFT_PRIME/licenses/COPYRIGHT-mysql-router
    non-root-user:
        plugin: nil
        after:
            - mysql
        overlay-script: |
            craftctl default
            # Create a user in the $CRAFT_OVERLAY chroot
            groupadd -R $CRAFT_OVERLAY -g 584788 mysql
            useradd -R $CRAFT_OVERLAY --create-home -r -g mysql -u 584788 mysql
            mkdir -p $CRAFT_OVERLAY/var/lib/mysql
            mkdir -p $CRAFT_OVERLAY/run/mysqld
            mkdir -p $CRAFT_OVERLAY/etc/mysql
            chown -R 584788 $CRAFT_OVERLAY/var/lib/mysql*
            chown -R 584788 $CRAFT_OVERLAY/run/mysqld
            chown -R 584788 $CRAFT_OVERLAY/etc/mysql
            # Generate dpkg.query
            mkdir -p $CRAFT_OVERLAY/usr/share/rocks
            echo "# os-release" > $CRAFT_OVERLAY/usr/share/rocks/dpkg.query
            echo "# dpkg-query" >> $CRAFT_OVERLAY/usr/share/rocks/dpkg.query
            declare -a fields
            fields+=('${db:Status-Abbrev}')
            fields+=('${binary:Package}')
            fields+=('${Version}')
            fields+=('${source:Package}')
            fields+=('${Source:Version}')
            printf -v dpkg_ops '%s,' "${fields[@]}"
            dpkg-query -W -f "${dpkg_ops}\n" --root=${CRAFT_OVERLAY} >> $CRAFT_OVERLAY/usr/share/rocks/dpkg.query
    rock-entrypoint:
        plugin: dump
        source: .
        source-type: local
        stage:
            - usr/local/bin/
        organize:
            scripts/entrypoint.sh: /usr/local/bin/entrypoint.sh
    rock-license:
        plugin: dump
        source: .
        source-type: local
        stage:
            - licenses/LICENSE-rock
        organize:
            LICENSE: licenses/LICENSE-rock
    mysql-config:
        plugin: dump
        source: .
        source-type: local
        stage:
            - etc/mysql
        organize:
            config/my.cnf: /etc/mysql/my.cnf
