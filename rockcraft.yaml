name: mysql
base: bare
build-base: devel
version: '8.4.9'
summary: MySQL rock OCI
description: |
    MySQL built from the official MySQL package from the MySQL repository.
    For more information on rocks, visit https://github.com/canonical/rockcraft.
license: Apache-2.0
platforms:
    amd64:
    arm64:
    s390x:

environment:
    TZ: UTC

services:
    mysql:
        override: replace
        command: /usr/local/bin/entrypoint.sh mysqld
        startup: enabled
        user: mysql
        group: mysql

parts:
    mysql:
        plugin: dump
        source: bld:mysql
        source-channel: 8.4-26.04/edge
        stage-packages:
            - libicu78
            - libprotobuf-lite32t64
            - libaio1t64
            - libgoogle-perftools4t64
            - libmecab2
            - libedit2
            - liblz4-1
            - coreutils-from-uutils
            - mawk
            - sed
            - tzdata
            - openssl
            - dash
            - bash
        stage:
            - -etc/mysql
        organize:
            usr/share/doc/mysql-client-8.0/copyright: licenses/COPYRIGHT-mysql-client-8.0
            usr/share/doc/mysql-server-core-8.0/copyright: licenses/COPYRIGHT-mysql-server-core-8.0
            usr/share/doc/openssl/copyright: licenses/COPYRIGHT-openssl
            usr/share/doc/pwgen/copyright: licenses/COPYRIGHT-pwgen
    non-root-user:
        plugin: nil
        after:
            - mysql
        override-build: |
            craftctl default

            # Needed for bare base
            # https://github.com/canonical/rockcraft/issues/193#issuecomment-1429594574
            mkdir $CRAFT_PART_INSTALL/etc
            chmod 755 $CRAFT_PART_INSTALL/etc

            # Create a user in the $CRAFT_PART_INSTALL chroot
            groupadd -R $CRAFT_PART_INSTALL -g 584788 mysql
            useradd -R $CRAFT_PART_INSTALL --create-home -r -g mysql -u 584788 mysql

            mkdir -p $CRAFT_PART_INSTALL/var/lib/mysql
            mkdir -p $CRAFT_PART_INSTALL/run/mysqld
            mkdir -p $CRAFT_PART_INSTALL/etc/mysql
            chown -R 584788 $CRAFT_PART_INSTALL/var/lib/mysql*
            chown -R 584788 $CRAFT_PART_INSTALL/run/mysqld
            chown -R 584788 $CRAFT_PART_INSTALL/etc/mysql
            # Generate dpkg.query
            mkdir -p $CRAFT_PART_INSTALL/usr/share/rocks
            echo "# os-release" > $CRAFT_PART_INSTALL/usr/share/rocks/dpkg.query
            echo "# dpkg-query" >> $CRAFT_PART_INSTALL/usr/share/rocks/dpkg.query
            declare -a fields
            fields+=('${db:Status-Abbrev}')
            fields+=('${binary:Package}')
            fields+=('${Version}')
            fields+=('${source:Package}')
            fields+=('${Source:Version}')
            printf -v dpkg_ops '%s,' "${fields[@]}"
            dpkg-query -W -f "${dpkg_ops}\n" --root=${CRAFT_PART_INSTALL} >> $CRAFT_PART_INSTALL/usr/share/rocks/dpkg.query
    rock-entrypoint:
        plugin: dump
        source: .
        source-type: local
        stage:
            - usr/local/bin/
        organize:
            scripts/entrypoint.sh: /usr/local/bin/entrypoint.sh
    rock-license:
        plugin: dump
        source: .
        source-type: local
        stage:
            - licenses/LICENSE-rock
        organize:
            LICENSE: licenses/LICENSE-rock
    mysql-config:
        plugin: dump
        source: .
        source-type: local
        stage:
            - etc/mysql
        organize:
            config/my.cnf: /etc/mysql/my.cnf
